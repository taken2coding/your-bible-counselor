services:
  - type: static_site
    name: your-bible-counselor
    branch: main
    buildCommand: npm run build
    staticPublishPath: dist
    # no server — pure static, free CDN, never sleeps
    headers:
      - path: /*
        name: Content-Security-Policy
        value: default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
